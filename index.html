<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinical Text AI for Healthcare Leaders</title>
  <meta name="description" content="A CPD course for clinical and operational leaders on what natural language processing can really do with hospital records.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#/" class="brand" id="brand">Clinical Text AI for Healthcare Leaders</a>
      <nav class="header-nav" aria-label="Course navigation">
        <a href="#/">Course home</a>
        <a href="#/certificate">Certificate</a>
        <button type="button" class="link-button" id="reset-progress">Reset progress</button>
      </nav>
    </div>
  </header>

  <div id="preview-banner" class="preview-banner no-print" hidden>
    <div class="wrap">Preview mode: all sections are open. Quizzes still record normally; the certificate still requires every quiz to be passed.
      <button type="button" class="link-button" id="preview-off">Turn off</button></div>
  </div>

  <main id="main" class="wrap" tabindex="-1">
    <div id="app" aria-live="polite">
      <p class="loading">Loading course content…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-text">All course content is loaded from YAML files in the <code>content/</code> folder.</p>
    </div>
  </footer>

  <script src="js/vendor/js-yaml.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
